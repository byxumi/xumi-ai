name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'tool/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders
        run: flutter create --org com.xumitech --project-name xumi_ai . --platforms=android

      - name: Patch AndroidManifest (INTERNET / cleartext / label)
        run: python3 tool/patch_android_manifest.py

      - name: Patch package id (com.xumitech.ai)
        run: python3 tool/patch_package_id.py

      - name: Setup fixed release signing key
        run: python3 tool/setup_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APKs (split by ABI, monotonic versionCode)
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Upload APKs to GitHub Release (quota-safe)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-apk"
          # 删除旧 Release（保留资产独立配额、避免重名冲突）
          gh release delete "$TAG" --yes --cleanup-tag || true
          # 创建新 Release 并上传 APK
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk \
            --title "须弥AI 最新构建" \
            --notes "最新 APK（arm64-v8a / armeabi-v7a / x86_64）" \
            --prerelease
          echo "=== Release uploaded ==="

      - name: Clean old artifacts (best-effort)
        shell: bash
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.id) | reverse | .[3:][] | .id' 2>/dev/null || true)
          if [ -n "$ids" ]; then
            for id in $ids; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 \
                && echo "deleted $id" || echo "delete $id failed"
            done
          else
            echo "no old artifacts to delete"
          fi