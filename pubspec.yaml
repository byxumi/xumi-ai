name: xumi_ai
description: 须弥AI —— 轻快好用的多模型 AI 聊天助手，支持多个 OpenAI 兼容 API 接口自由切换（DeepSeek / 豆包 / 自定义）。
publish_to: "none"
version: 2.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2

  # 网络请求
  dio: ^5.4.3

  # 本地持久化
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true